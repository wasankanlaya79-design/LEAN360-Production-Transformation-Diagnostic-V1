<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LEAN360 Production Transformation Diagnostic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8ECEF; --surface:#F8FAFB; --sunk:#DDE3E8; --ink:#16212B; --ink2:#4B5A67; --ink3:#7B8894;
  --line:#CBD3DA; --side:#1B2833; --side2:#24333F; --side-ink:#C5CFD7; --side-dim:#7F909D;
  --red:#C23E37; --amber:#D99A00; --green:#2C8A57; --blue:#2D69A3; --white-lamp:#E9EEF2;
  --red-soft:#F5DEDC; --amber-soft:#F7ECCB; --green-soft:#D8EEDF; --blue-soft:#DCE8F3;
  --focus:#2D69A3;
  --font:"IBM Plex Sans Thai","Noto Sans Thai","Leelawadee UI","Tahoma",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F161C; --surface:#172129; --sunk:#111A21; --ink:#E2E8ED; --ink2:#A3B1BD; --ink3:#73828F;
    --line:#2B3843; --side:#0A1015; --side2:#141E26; --side-ink:#C5CFD7; --side-dim:#6C7C89;
    --red-soft:#3A1E1C; --amber-soft:#3A2F12; --green-soft:#16301F; --blue-soft:#162A3D;
  }
}
:root[data-theme="dark"]{
  --bg:#0F161C; --surface:#172129; --sunk:#111A21; --ink:#E2E8ED; --ink2:#A3B1BD; --ink3:#73828F;
  --line:#2B3843; --side:#0A1015; --side2:#141E26; --side-ink:#C5CFD7; --side-dim:#6C7C89;
  --red-soft:#3A1E1C; --amber-soft:#3A2F12; --green-soft:#16301F; --blue-soft:#162A3D;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.65;height:100%;overflow:hidden}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
img,svg{max-width:100%}
.app{display:grid;grid-template-columns:264px minmax(0,1fr);height:100%;min-height:0}
.col{display:flex;flex-direction:column;height:100%;min-width:0;min-height:0}
.side{grid-column:1;grid-row:1}.col{grid-column:2;grid-row:1}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:39;display:none}

/* sidebar */
.side{background:var(--side);color:var(--side-ink);height:100%;overflow-y:auto;padding:22px 14px 30px}
.brand{padding:0 8px 18px;border-bottom:1px solid var(--side2);margin-bottom:12px}
.brand b{display:block;font-size:22px;letter-spacing:.5px;color:#fff;font-weight:700}
.brand span{font-size:12.5px;color:var(--side-dim);line-height:1.5;display:block;margin-top:2px}
.lamp-strip{display:flex;gap:4px;margin-top:10px}
.lamp-strip i{width:22px;height:5px;border-radius:2px;background:var(--side2)}
.lamp-strip i.r{background:var(--red)}.lamp-strip i.a{background:var(--amber)}.lamp-strip i.g{background:var(--green)}
.brand .bsub{color:#E9EEF2;font-size:13px;font-weight:600;margin-top:2px}
.credit-side{margin:22px 8px 0;padding-top:14px;border-top:1px solid var(--side2);font-size:12px;line-height:1.55;color:var(--side-dim)}
.credit-side span{display:block}.credit-side b{display:block;color:var(--side-ink);font-size:13.5px;font-weight:600}
.credit-side a{color:var(--side-ink)}
.credit{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;line-height:1.6;color:var(--ink2)}
.credit .ck{font-size:12px;color:var(--ink3)}.credit .cn{font-size:16px;font-weight:700;color:var(--ink)}
.credit a{color:inherit}
.report .credit{border-color:#16212B;color:#4B5A67}.report .credit .cn{color:#16212B}
.navg{margin:14px 0 4px;padding:0 8px;font-size:12px;color:var(--side-dim)}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:0;background:none;text-align:left;padding:7px 10px;border-radius:6px;cursor:pointer;color:var(--side-ink);font-size:14px}
.nav button:hover{background:var(--side2)}
.nav button[aria-current="page"]{background:var(--side2);color:#fff;box-shadow:inset 3px 0 0 var(--amber)}
.nav small{font-size:11.5px;color:var(--side-dim);font-variant-numeric:tabular-nums}
.nav small.done{color:#7FCB9C}

/* main */
.main{flex:1;min-height:0;overflow-y:auto;min-width:0;padding:28px clamp(16px,4vw,48px) 60px}
.topbar{display:none}
.vh{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:22px}
.vh h1{margin:0;font-size:28px;line-height:1.3;font-weight:700}
.vh p{margin:4px 0 0;color:var(--ink2);max-width:68ch}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.warn{color:var(--red);border-color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px}
.grid{display:grid;gap:16px}
h2{font-size:18px;margin:0 0 10px;font-weight:600;line-height:1.4}
h3{font-size:15px;margin:0 0 6px;font-weight:600}
.muted{color:var(--ink2)}
.small{font-size:13px}
.sec{margin-top:28px}

/* dashboard */
.dash-top{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:16px}
.tower-wrap{display:flex;gap:18px;align-items:stretch}
.tower{display:flex;flex-direction:column;gap:3px;width:62px;flex:none}
.tower .cap{height:10px;background:var(--ink3);border-radius:6px 6px 0 0;margin:0 6px}
.tower .seg{height:34px;border-radius:3px;background:var(--sunk);border:1px solid var(--line);position:relative;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--ink3)}
.tower .seg.on{color:#fff;border-color:transparent}
.tower .seg.on.l1{background:var(--red)} .tower .seg.on.l2{background:var(--amber)} .tower .seg.on.l3{background:var(--green)} .tower .seg.on.l4{background:var(--blue)} .tower .seg.on.l5{background:#8FA3B4}
.tower .seg.cur{box-shadow:0 0 0 3px var(--surface),0 0 0 5px currentColor;}
.tower .pole{height:28px;width:10px;background:var(--ink3);margin:0 auto}
.tower .base{height:8px;background:var(--ink3);border-radius:3px}
.lvl-text .k{font-size:13px;color:var(--ink2)}
.lvl-text .lv{font-size:40px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.lvl-text .ln{font-size:18px;font-weight:600;line-height:1.35}
.lvl-text p{margin:8px 0 0;font-size:13.5px;color:var(--ink2)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.fact{border-top:3px solid var(--line);padding-top:8px}
.fact .k{font-size:12.5px;color:var(--ink2)}
.fact .v{font-weight:600;line-height:1.4}
.fact.good{border-color:var(--green)}.fact.bad{border-color:var(--red)}.fact.pri{border-color:var(--amber)}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;text-align:left;display:block;width:100%}
.kpi:hover{border-color:var(--ink3)}
.kpi .k{font-size:12.5px;color:var(--ink2);line-height:1.35;min-height:2.7em}
.kpi .v{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .v small{font-size:14px;color:var(--ink3);font-weight:500}
.kpi .meter{height:6px;background:var(--sunk);border-radius:3px;margin-top:8px;overflow:hidden}
.kpi .meter i{display:block;height:100%}
.kpi .p{font-size:11.5px;color:var(--ink3);margin-top:6px}
.c-red{color:var(--red)}.c-amber{color:var(--amber)}.c-green{color:var(--green)}.c-none{color:var(--ink3)}
.b-red{background:var(--red)}.b-amber{background:var(--amber)}.b-green{background:var(--green)}.b-none{background:var(--ink3)}
.empty{border:1px dashed var(--ink3);border-radius:8px;padding:18px 20px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:18px}
.empty p{margin:0;max-width:60ch}

/* bars */
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;font-size:14px}
.bar .track{height:18px;background:var(--sunk);border-radius:3px;position:relative;overflow:hidden}
.bar .track i{position:absolute;inset:0 auto 0 0;border-radius:3px}
.bar .track .tick{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.bar b{font-variant-numeric:tabular-nums;text-align:right}

/* map */
.tmap{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:0;position:relative}
.st{position:relative;padding:34px 6px 0;text-align:center;font-size:12.5px;line-height:1.35}
.st::before{content:"";position:absolute;top:13px;left:0;right:0;height:4px;background:var(--line)}
.st:first-child::before{left:50%}.st:last-child::before{right:50%}
.st.ok::before{background:var(--green)}
.st .dot{position:absolute;top:4px;left:50%;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;background:var(--surface);border:3px solid var(--line);z-index:1}
.st.ok .dot{background:var(--green);border-color:var(--green)}
.st.here .dot{background:var(--amber);border-color:var(--amber);box-shadow:0 0 0 4px var(--amber-soft)}
.st b{display:block;font-weight:600}
.st span{color:var(--ink3);font-size:11.5px}

/* steps */
.steps{display:flex;gap:4px;margin:0 0 18px;overflow-x:auto;padding-bottom:4px}
.steps button{flex:1 0 auto;border:0;background:var(--sunk);padding:8px 12px;font-size:13px;cursor:pointer;color:var(--ink2);border-radius:4px;text-align:left;min-width:110px}
.steps button b{display:block;font-size:11.5px;font-weight:500;color:var(--ink3)}
.steps button.cur{background:var(--ink);color:var(--bg)}
.steps button.cur b{color:var(--bg);opacity:.7}
.steps button.done{box-shadow:inset 0 -3px 0 var(--green)}

/* questions */
.stick{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;margin-bottom:12px}
.legend{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.missbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;padding:8px 8px 8px 14px;margin-bottom:8px;border-radius:6px;background:var(--amber-soft);border:1px solid var(--amber);font-size:14px}
.missbar.ok{background:var(--green-soft);border-color:var(--green);padding:8px 14px}
.missbar .btn{padding:5px 12px;font-size:13px}
.misstag{display:inline-block;font-size:11.5px;font-weight:600;padding:0 7px;border-radius:4px;background:var(--red-soft);color:var(--red);white-space:nowrap;line-height:1.7}
.misstag[hidden]{display:none}
.nores{font-size:12.5px;color:var(--red);font-weight:600}
.q .qm{display:none;margin-left:8px;vertical-align:1px}
.q.miss{box-shadow:inset 4px 0 0 var(--amber)}
.q.miss .qm{display:inline-block}
.q.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%{background:var(--amber-soft)}100%{background:transparent}}
.missbox{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;padding:14px 18px;margin-bottom:18px;border-radius:8px;background:var(--amber-soft);border:1px solid var(--amber)}
.missbox h3{margin:0}.missbox p{margin:2px 0 0;font-size:13.5px;color:var(--ink2);max-width:62ch}
.missbox .btn{font-size:13px;padding:6px 10px}
.nav small.part{color:#E8B84A}
.steps button.part{box-shadow:inset 0 -3px 0 var(--amber)}
.path .node.none{border-style:dashed;color:var(--ink2)}
.report .missbox{background:#FBF1D3;border-color:#D99A00}
.legend div{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12.5px;line-height:1.4}
.legend b{font-size:15px;margin-right:4px}
.dim{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:14px;overflow:hidden}
.dimhead{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--sunk)}
.dimhead .did{font-weight:700;font-size:13px;color:var(--ink2);min-width:38px}
.dimhead h2{margin:0;font-size:16px;flex:1}
.dimhead .dsc{font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.q{display:grid;grid-template-columns:1fr auto;gap:10px 20px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.qt{margin:0;display:flex;gap:10px}
.qn{color:var(--ink3);font-variant-numeric:tabular-nums;min-width:18px}
.sc{display:flex;gap:4px}
.sc label{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:40px;height:40px;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:var(--surface);font-weight:600;font-variant-numeric:tabular-nums}
.sc.wide label{min-width:62px;height:48px}
.sc label small{font-size:10px;font-weight:500;color:var(--ink3);line-height:1.2;text-align:center;padding:0 2px}
.sc input{position:absolute;opacity:0;pointer-events:none}
.sc label:hover{border-color:var(--ink3)}
.sc label:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:2px}
.sc label.on{color:#fff;border-color:transparent}
.sc label.on small{color:#fff}
.sc label.on.v1,.sc label.on.v2{background:var(--red)}
.sc label.on.v3{background:var(--amber)}
.sc label.on.v4,.sc label.on.v5{background:var(--green)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.modprog{font-size:13px;color:var(--ink2)}

/* forms */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px}
.f label{display:block;font-size:13px;color:var(--ink2);margin-bottom:4px}
.f input,.f select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.f.full{grid-column:1/-1}
.radios{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:var(--surface);font-size:14px;user-select:none}
.chip input{accent-color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.on input{accent-color:var(--amber)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.ptop{display:grid;gap:8px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.rank{display:inline-flex;width:26px;height:26px;border-radius:50%;align-items:center;justify-content:center;font-weight:700;font-size:13px;background:var(--sunk);color:var(--ink3);flex:none}
.rank.on{background:var(--amber);color:#1b1300}
.prow button{border:1px solid var(--line);background:none;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px}

/* results */
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.gate{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface)}
.gate .lt{width:14px;height:14px;border-radius:50%;margin-top:5px}
.gate.pass .lt{background:var(--green)}.gate.fail .lt{background:var(--red)}.gate.na .lt{background:var(--ink3)}
.gate.fail{background:var(--red-soft);border-color:transparent}
.gate p{margin:0;font-size:13.5px;color:var(--ink2)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;font-weight:600;color:var(--ink2);background:var(--sunk)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:4px;white-space:nowrap}
.t-now{background:var(--ink);color:var(--bg)}
.t-next{background:var(--blue);color:#fff}
.t-later{border:1px solid var(--ink3);color:var(--ink2)}
.flag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:4px;background:var(--amber-soft);color:var(--ink);margin:2px 4px 0 0}
.flag.stop{background:var(--red-soft)}
.radar svg{display:block;margin:0 auto;width:100%;max-width:440px;height:auto}
.radar text{fill:var(--ink2);font-family:var(--font)}

/* roadmap */
.road{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.phase{padding:16px 18px;border-right:1px solid var(--line)}
.phase:last-child{border-right:0}
.phase>h3{display:flex;align-items:baseline;gap:8px;font-size:20px;margin-bottom:2px}
.phase>p{margin:0 0 12px;font-size:13px;color:var(--ink2)}
.phase.now{box-shadow:inset 0 4px 0 var(--ink)}.phase.next{box-shadow:inset 0 4px 0 var(--blue)}.phase.later{box-shadow:inset 0 4px 0 var(--ink3)}
.item{padding:10px 0;border-top:1px solid var(--line)}
.item b{display:block;font-weight:600;line-height:1.4}
.item .meta{font-size:12.5px;color:var(--ink2)}
.path{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.path .node{padding:6px 10px;border-radius:6px;font-size:13px;border:1px solid var(--line);background:var(--surface)}
.path .node.ok{background:var(--green-soft);border-color:var(--green)}
.path .node.wip{background:var(--amber-soft);border-color:var(--amber)}
.path .arr{color:var(--ink3)}
.path .node small{display:block;font-size:11px;color:var(--ink2)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:14px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

/* report */
.report{background:#fff;color:#16212B;border:1px solid var(--line);border-radius:8px;padding:clamp(18px,4vw,44px);max-width:1000px}
.report h2{font-size:19px;border-bottom:2px solid #16212B;padding-bottom:4px;margin-top:28px}
.report .rh{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;border-bottom:6px solid #16212B;padding-bottom:12px}
.report .rh h1{margin:0;font-size:24px}
.report table th{background:#EEF1F3;color:#4B5A67}
.report table td,.report table th{border-color:#D5DBE0}
.report .muted{color:#4B5A67}
.report .radar text{fill:#4B5A67}
.report .three{gap:8px}

@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .col{grid-column:1}
  .side{position:fixed;inset:0 auto 0 0;height:auto;width:280px;z-index:40;transform:translateX(-100%);transition:transform .2s;padding-top:calc(22px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:39;display:none}
  .scrim.open{display:block}
  .topbar{display:flex;flex:none;align-items:center;gap:12px;z-index:30;background:var(--side);color:#fff;padding:10px 16px}
  .topbar button{background:none;border:1px solid var(--side2);color:#fff;border-radius:6px;padding:4px 10px;cursor:pointer}
  .topbar b{font-size:17px}
  .dash-top,.two,.three,.road{grid-template-columns:1fr}
  .phase{border-right:0;border-bottom:1px solid var(--line)}
  .tmap{grid-template-columns:1fr}
  .st{padding:0 0 18px 40px;text-align:left}
  .st::before{top:0;bottom:0;left:13px;right:auto;width:4px;height:auto}

function save(){S.updated=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ============ คำนวณคะแนน ============ */
const avg=a=>{const v=a.filter(x=>x!=null&&!isNaN(x));return v.length?v.reduce((p,c)=>p+c,0)/v.length:null};
function dimScore(id){const d=DIM[id];return avg(d.qs.map((_,i)=>S.answers[id+'_'+(i+1)]))}
function modScore(id){return avg(MOD[id].dims.map(d=>dimScore(d.id)))}
function sc(key){return MOD[key]?modScore(key):dimScore(key)}
function answered(mid){return MOD[mid].n-missing(mid).length}
function missing(mid){const out=[];MOD[mid].dims.forEach(d=>d.qs.forEach((q,i)=>{const qid=d.id+'_'+(i+1);if(!S.answers[qid])out.push({qid,d,k:i+1,q})}));return out}
function dimMissing(id){return DIM[id].qs.filter((_,i)=>!S.answers[id+'_'+(i+1)]).length}
function totalMissing(){return MODULES.reduce((a,m)=>a+missing(m.id).length,0)}
function core(){const o={};MODULES.forEach(m=>o[m.id]=modScore(m.id));return o}
const nz=v=>v==null?0:v;
function level(c){const L=nz(c.lean),P=nz(c.dl),R=nz(c.dr),A=nz(c.air);
 if(L>=3.5&&P>=3.5&&R>=4&&A>=3.5)return 5;if(L>=3.5&&P>=3.5&&R>=3.5)return 4;if(L>=3&&P>=3)return 3;if(L>=2.5)return 2;return 1}
function fmt(v){return v==null?'–':v.toFixed(1)}
function tone(v){return v==null?'none':v<2.5?'red':v<3.5?'amber':'green'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function anyData(){return Object.keys(S.answers).length>0}
const scoreCell=(v,id)=>v==null?'<span class="nores">ยังไม่ได้ประเมิน</span>':`<b class="c-${tone(v)}">${fmt(v)}</b>${id&&dimMissing(id)?` <span class="misstag">ขาด ${dimMissing(id)} ข้อ</span>`:''}`;

function gates(){const c=core(),L4=dimScore('L4'),DL8=dimScore('DL8');const g=[];const has=(...v)=>v.every(x=>x!=null);
 g.push({k:'ด่านลีน',fail:has(L4,c.ps)?(L4<3||c.ps<3):null,cond:`งานมาตรฐาน ${fmt(L4)} / ความเสถียร ${fmt(c.ps)} (ต้องได้ 3 ขึ้นไป)`,msg:'ยังไม่ควรเร่งลงทุนระบบอัตโนมัติ',ok:'มาตรฐานงานและความเสถียรพอจะต่อยอดระบบอัตโนมัติได้'});
 g.push({k:'ด่านดิจิทัล',fail:has(c.lean)?c.lean<3:null,cond:`ลีน ${fmt(c.lean)} (ต้องได้ 3 ขึ้นไป)`,msg:'ควรปรับพื้นฐานลีนก่อนทำดิจิทัลลีน',ok:'พื้นฐานลีนพร้อมสำหรับดิจิทัลลีน'});
 g.push({k:'ด่าน AI',fail:has(c.dr)?c.dr<3:null,cond:`ความพร้อมด้านข้อมูล ${fmt(c.dr)} (ต้องได้ 3 ขึ้นไป)`,msg:'ยังไม่พร้อมสำหรับ AI',ok:'ข้อมูลพร้อมพอจะเริ่มโครงการ AI'});
 g.push({k:'ด่าน AI ขั้นสูง',fail:has(c.dr,c.ps,DL8)?(c.dr<4||c.ps<3.5||DL8<3.5):null,cond:`ข้อมูล ${fmt(c.dr)} (≥4) / ความเสถียร ${fmt(c.ps)} (≥3.5) / การเชื่อมระบบ ${fmt(DL8)} (≥3.5)`,msg:'AI ควรอยู่แค่ระดับโครงการนำร่อง',ok:'พร้อมขยาย AI ไปใช้จริงทั้งไลน์'});
 return g}

function priorities(){const g=gates();const leanFail=g[0].fail===true,digFail=g[1].fail===true,aiFail=g[2].fail===true,advFail=g[3].fail!==false;
 return PROJECTS.map(p=>{const cur=avg(p.gap.map(sc));const gap=cur==null?4:Math.max(0,5-cur);
  let imp=2;p.pains.forEach(k=>{if(S.top3.includes(k))imp+=2;else if(S.pains.includes(k))imp+=1});imp=Math.min(5,imp);
  let rd=avg(p.ready.map(k=>sc(k)??1));rd=Math.max(1,Math.min(5,rd??1));const flags=[];
  if(p.auto&&leanFail){flags.push(['stop','ยังไม่ควรเร่งระบบอัตโนมัติ']);rd=Math.min(rd,2)}
  if(p.ph==='NEXT'&&digFail){flags.push(['','ทำพื้นฐานลีนก่อน']);rd=Math.min(rd,2.5)}
  if(p.ai&&aiFail){flags.push(['stop','รอความพร้อมด้านข้อมูล']);rd=Math.min(rd,1.5)}else if(p.ai&&advFail)flags.push(['','นำร่องเท่านั้น']);
  if(cur==null)flags.push(['stop','ยังไม่ได้ประเมินด้านนี้']);
  return Object.assign({},p,{cur,gap:Math.round(gap*10)/10,imp,rd:Math.round(rd*10)/10,score:Math.round(gap*imp*rd),flags})}).sort((a,b)=>b.score-a.score)}

function weakestDims(n){const a=[];Object.values(DIM).forEach(d=>{const s=dimScore(d.id);if(s!=null)a.push({d,s})});return a.sort((x,y)=>x.s-y.s).slice(0,n)}

const MAPSTEPS=[
 ['ฐานลีน','ลีน ≥ 3',c=>nz(c.lean)>=3],['กระบวนการนิ่ง','ความเสถียร ≥ 3',c=>nz(c.ps)>=3],['ข้อมูลดิจิทัล','DL1 ≥ 3',()=>nz(dimScore('DL1'))>=3],['ระบบเชื่อมต่อกัน','DL8 ≥ 3',()=>nz(dimScore('DL8'))>=3],
 ['เห็นผลเรียลไทม์','DL2 ≥ 3',()=>nz(dimScore('DL2'))>=3],['วิเคราะห์ข้อมูล','DL10 และข้อมูล ≥ 3',c=>nz(dimScore('DL10'))>=3&&nz(c.dr)>=3],['ใช้ AI','ใช้ AI ≥ 2.5 และพร้อม AI ≥ 3',c=>nz(c.ai)>=2.5&&nz(c.air)>=3],['หาค่าเหมาะสมที่สุด','AI10 ≥ 3',()=>nz(dimScore('AI10'))>=3]];

/* ============ กราฟ ============ */
function radar(dims,size){size=size||440;const n=dims.length,cx=size/2,cy=size/2,R=size*0.3;
 const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+Math.cos(a)*R*v/5,cy+Math.sin(a)*R*v/5]};
 let s=`<svg viewBox="0 0 ${size} ${size}" role="img" aria-label="กราฟเรดาร์">`;
 for(let l=1;l<=5;l++)s+=`<polygon points="${dims.map((_,i)=>pt(i,l).join(',')).join(' ')}" fill="none" stroke="var(--line)" stroke-width="${l===5?1.4:0.8}"/>`;
 dims.forEach((_,i)=>{const p=pt(i,5);s+=`<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="var(--line)" stroke-width=".8"/>`});
 [1,3,5].forEach(l=>{s+=`<text x="${cx+3}" y="${cy-R*l/5-2}" font-size="9">${l}</text>`});
 const vals=dims.map(d=>dimScore(d.id));
 if(vals.some(v=>v!=null)){s+=`<polygon points="${vals.map((v,i)=>pt(i,v??0).join(',')).join(' ')}" fill="rgba(45,105,163,.22)" stroke="var(--blue)" stroke-width="2"/>`;vals.forEach((v,i)=>{if(v!=null){const p=pt(i,v);s+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.2" fill="var(--blue)"/>`}})}
 dims.forEach((d,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;const x=cx+Math.cos(a)*(R+16),y=cy+Math.sin(a)*(R+16);const c=Math.cos(a);const anc=Math.abs(c)<0.2?'middle':c>0?'start':'end';const dy=Math.sin(a)>0.5?10:Math.sin(a)<-0.5?-4:4;
  s+=`<text x="${x}" y="${y+dy}" font-size="11" text-anchor="${anc}" ${vals[i]==null?'fill="var(--red)"':''}>${esc(d.short)} <tspan font-weight="600">${vals[i]==null?'ยังไม่ประเมิน':fmt(vals[i])}</tspan></text>`});
 return s+'</svg>'}
function coreBars(){const c=core();return `<div class="bars">${MODULES.map(m=>{const v=c[m.id],ms=missing(m.id).length;return `<div class="bar"><span>${m.kpi}${ms?`<br><span class="misstag">ยังไม่ได้ประเมิน ${ms} ข้อ</span>`:''}</span><div class="track">${[1,2,3,4].map(t=>`<span class="tick" style="left:${t*20}%"></span>`).join('')}<i class="b-${tone(v)}" style="width:${(nz(v)/5*100).toFixed(1)}%"></i></div><b class="c-${tone(v)}">${fmt(v)}</b></div>`}).join('')}</div>`}
function tower(lv){let s='<div class="tower" aria-label="ระดับ '+lv+' จาก 5"><div class="cap"></div>';for(let i=5;i>=1;i--)s+=`<div class="seg l${i}${i<=lv&&anyData()?' on':''}${i===lv&&anyData()?' cur':''}">ระดับ ${i}</div>`;return s+'<div class="pole"></div><div class="base"></div></div>'}
function tmap(){const c=core();let here=MAPSTEPS.findIndex(s=>!s[2](c));if(here<0)here=MAPSTEPS.length;return `<div class="tmap">${MAPSTEPS.map((s,i)=>`<div class="st ${i<here?'ok':''} ${i===here&&anyData()?'here':''}"><i class="dot"></i><b>${s[0]}</b><span>${s[1]}</span></div>`).join('')}</div>`}
function pathsHTML(){const sel=new Set(S.pains);let list=PATHS.filter(p=>p.pains.some(k=>sel.has(k)));let note='';
 if(!list.length){list=PATHS;note='<p class="muted small">ยังไม่ได้เลือกปัญหา เลยแสดงทุกเส้นทางไว้ให้ดูก่อน</p>'}
 const aiBlocked=gates()[2].fail===true;
 return note+list.map(p=>{const top=p.pains.some(k=>S.top3.includes(k));
  return `<div class="item"><b>${p.title}${top?' <span class="tag t-now">ปัญหาหลัก</span>':''}</b><div class="path">${p.steps.map((st,i)=>{const v=sc(st[1]);const cls=v==null?'none':v>=3.5?'ok':v>=2.5?'wip':'';
   return (i?'<span class="arr" aria-hidden="true">→</span>':'')+`<span class="node ${cls}">${st[0]}<small>${st[1]} ${v==null?'ยังไม่ได้ประเมิน':fmt(v)}</small></span>`}).join('')}</div>${aiBlocked?'<p class="small muted" style="margin:6px 0 0">ขั้นสุดท้ายต้องรอความพร้อมด้านข้อมูลถึง 3 ก่อน ระหว่างนี้ทำขั้นก่อนหน้าให้แน่น</p>':''}</div>`}).join('')}

const NAV=[['ภาพรวม',[['dashboard','แดชบอร์ด']]],['ข้อมูลพื้นฐาน',[['org','ข้อมูลองค์กร'],['pains','ปัญหาของฝ่ายผลิต']]],['แบบประเมิน',[['lean','ความพร้อมด้านลีน'],['ps','ความเสถียรของกระบวนการ'],['dl','ดิจิทัลลีน'],['dr','ความพร้อมด้านข้อมูล'],['ai','การใช้ AI จริง'],['air','ความพร้อมด้าน AI']]],['ผลลัพธ์',[['results','ผลการประเมิน'],['reco','ข้อเสนอแนะ'],['action','แผนปฏิบัติการ'],['report','รายงาน']]],['อ้างอิง',[['kb','คลังความรู้']]]];

function renderNav(){document.getElementById('nav').innerHTML=NAV.map(([g,items])=>`<div class="navg">${g}</div>`+items.map(([id,label])=>{let extra='';if(MOD[id])extra=navCount(id);if(id==='pains'&&S.pains.length)extra=`<small>${S.pains.length}</small>`;return `<button data-go="${id}" ${id===view?'aria-current="page"':''}><span>${label}</span>${extra}</button>`}).join('')).join('')}

function missSummary(compact){const rows=MODULES.map(m=>({m,c:missing(m.id).length})).filter(x=>x.c);if(!rows.length)return '';
 const t=totalMissing();

function vDash(){const c=core(),lv=level(c),pr=priorities();const ranked=MODULES.map(m=>({m,v:c[m.id]})).filter(x=>x.v!=null);
 const strong=ranked.length?ranked.reduce((a,b)=>b.v>a.v?b:a):null,weak=ranked.length?ranked.reduce((a,b)=>b.v<a.v?b:a):null;
 const total=MODULES.reduce((a,m)=>a+m.n,0),done=total-totalMissing();const name=S.org.name?esc(S.org.name):'ฝ่ายผลิตของคุณ';
 let h=header('LEAN360 Production Transformation Diagnostic','ระบบวินิจฉัยความพร้อมเพื่อยกระดับการผลิตจาก Lean สู่ Digital Lean และ AI<br><span class="small">ตรวจฝ่ายผลิตตั้งแต่พื้นฐานลีน ความเสถียรของกระบวนการ ดิจิทัลลีน ความพร้อมด้านข้อมูล ไปจนถึง AI จะได้รู้ว่าจุดอ่อนอยู่ตรงไหน และควรเริ่มพัฒนาอะไรก่อน</span>',
  `<button class="btn pri" data-go="${firstOpen()}">${done?'ทำแบบประเมินต่อ':'เริ่มทำแบบประเมิน'}</button><button class="btn" data-go="results">ดูผลการประเมิน</button><button class="btn" data-go="reco">ดูแผนพัฒนา</button><button class="btn" data-act="export">ส่งออกรายงาน</button><button class="btn" data-act="print">พิมพ์ PDF</button>`);
 if(!anyData())h+=`<div class="empty"><p><b>ยังไม่มีคำตอบ</b> เริ่มจากกรอกข้อมูลองค์กรกับเลือกปัญหาก่อน แล้วค่อยทำแบบประเมินทีละส่วน ทั้งหมด ${total} ข้อ ถ้าอยากดูหน้าตาผลก่อน ลองใส่ข้อมูลตัวอย่างได้</p><div class="actions"><button class="btn pri" data-go="org">กรอกข้อมูลองค์กร</button><button class="btn" data-act="sample">ใส่ข้อมูลตัวอย่าง</button></div></div>`;
 else h+=missSummary(true);
 h+=`<div class="dash-top"><div class="panel tower-wrap">${tower(lv)}<div class="lvl-text"><div class="k">ระดับการพัฒนาฝ่ายผลิต</div><div class="lv">${anyData()?'ระดับ '+lv:'–'}</div><div class="ln">${anyData()?LEVELS[lv].n:'ยังไม่มีผล'}</div><p>${anyData()?LEVELS[lv].d:'ตอบแบบประเมินแล้วไฟจะขึ้นตามระดับที่ได้'}</p></div></div>
 <div class="panel"><h2>${name}</h2><p class="muted small" style="margin:-4px 0 0">ตอบแล้ว ${done} จาก ${total} ข้อ${S.updated?' บันทึกล่าสุด '+new Date(S.updated).toLocaleString('th-TH'):''}</p>
 <div class="facts"><div class="fact good"><div class="k">ด้านที่แข็งที่สุด</div><div class="v">${strong?strong.m.kpi+' '+fmt(strong.v):'–'}</div></div><div class="fact bad"><div class="k">ด้านที่ต้องเร่งที่สุด</div><div class="v">${weak?weak.m.kpi+' '+fmt(weak.v):'–'}</div></div><div class="fact pri"><div class="k">โครงการที่ควรเริ่มก่อน</div><div class="v">${anyData()?pr[0].name:'–'}</div></div></div>
 <div class="sec" style="margin-top:18px">${coreBars()}</div></div></div>`;
 h+=`<div class="sec kpis">${MODULES.map(m=>{const v=c[m.id],ms=missing(m.id).length;return `<button class="kpi" data-go="${m.id}"><div class="k">${m.kpi}</div><div class="v c-${tone(v)}">${fmt(v)}<small> /5</small></div><div class="meter"><i class="b-${tone(v)}" style="width:${nz(v)/5*100}%"></i></div><div class="p">${ms===0?'<span class="c-green">ประเมินครบแล้ว</span>':ms===m.n?'<span class="c-red">ยังไม่ได้ประเมิน</span>':`<span class="c-red">ยังไม่ได้ประเมิน ${ms} ข้อ</span>`}</div></button>`}).join('')}</div>`;
 h+=`<section class="sec panel"><h2>เส้นทางจากลีน สู่ดิจิทัล และ AI</h2><p class="muted small" style="margin-top:-6px">จุดสีเหลืองคือจุดที่ฝ่ายผลิตยืนอยู่ตอนนี้ ต้องผ่านเงื่อนไขของแต่ละขั้นก่อนค่อยไปขั้นถัดไป</p>${tmap()}</section>`;
 const gs=gates().filter(g=>g.fail===true);if(gs.length)h+=`<section class="sec"><h2>สิ่งที่ต้องระวังตอนนี้</h2><div class="grid">${gs.map(gateHTML).join('')}</div></section>`;
 return h+CREDIT}
function firstOpen(){for(const m of MODULES)if(missing(m.id).length)return m.id;return 'results'}
function gateHTML(g){const st=g.fail===null?'na':g.fail?'fail':'pass';return `<div class="gate ${st}"><i class="lt"></i><div><h3>${g.k}: ${g.fail===null?'ยังไม่ได้ประเมินข้อที่เกี่ยวข้อง':g.fail?g.msg:'ผ่าน'}</h3><p>${g.cond}${g.fail===false?' '+g.ok:''}</p></div></div>`}

function vOrg(){const o=S.org;const f=(k,l,t)=>`<div class="f"><label for="o-${k}">${l}</label><input id="o-${k}" data-org="${k}" type="${t||'text'}" value="${esc(o[k])}" ${t==='number'?'min="0" inputmode="numeric"':''}></div>`;
 const sel=(k,l,opts)=>`<div class="f"><label for="o-${k}">${l}</label><select id="o-${k}" data-org="${k}"><option value="">เลือก</option>${opts.map(x=>`<option ${o[k]===x?'selected':''}>${x}</option>`).join('')}</select></div>`;
 const rad=(k,l,opts)=>`<div class="f full"><label>${l}</label><div class="radios">${opts.map(x=>`<label class="chip ${o[k]===x?'on':''}"><input type="radio" name="o-${k}" data-org="${k}" value="${x}" ${o[k]===x?'checked':''}>${x}</label>`).join('')}</div></div>`;

 ${sel('size','ขนาดองค์กร',['ขนาดเล็ก','ขนาดกลาง','ขนาดใหญ่'])}${f('employees','จำนวนพนักงานทั้งหมด','number')}${f('prodEmployees','จำนวนพนักงานฝ่ายผลิต','number')}${f('lines','จำนวนสายการผลิต','number')}${f('machines','จำนวนเครื่องจักร','number')}
 ${sel('automation','ระดับการใช้ระบบอัตโนมัติ',['ใช้คนเป็นหลัก','กึ่งอัตโนมัติ','อัตโนมัติบางส่วน','อัตโนมัติเกือบทั้งหมด'])}
 ${rad('system','รูปแบบการผลิต',['ผลิตเก็บสต็อก','ผลิตตามคำสั่งซื้อ','ออกแบบและผลิตตามคำสั่งซื้อ'])}${rad('ptype','ประเภทการผลิต',['ผลิตเป็นชิ้น','ผลิตแบบต่อเนื่อง','งานประกอบ'])}
 <div class="f full"><label>ระบบที่ใช้อยู่</label><div class="radios">${SYSTEMS.map(x=>`<label class="chip ${S.systems.includes(x)?'on':''}"><input type="checkbox" data-sys="${x}" ${S.systems.includes(x)?'checked':''}>${x}</label>`).join('')}</div></div></div></div>

function vPains(){return header('ปัญหาของฝ่ายผลิต','เลือกปัญหาที่เจออยู่จริงได้หลายข้อ แล้วจัด 3 อันดับที่หนักสุด ระบบจะใช้ 3 อันดับนี้ไปจัดลำดับความสำคัญของโครงการ')+
 `<div class="two"><div class="panel"><h2>ปัญหาที่เจออยู่</h2><div class="pgrid">${PAINS.map(([k,l])=>`<label class="chip ${S.pains.includes(k)?'on':''}"><input type="checkbox" data-pain="${k}" ${S.pains.includes(k)?'checked':''}>${l}</label>`).join('')}</div></div>
 <div class="panel"><h2>3 ปัญหาหลัก</h2><p class="muted small" style="margin-top:-6px">กดปุ่มเพื่อจัดอันดับตามลำดับที่กด</p><div class="ptop">${S.pains.length?S.pains.map(k=>{const r=S.top3.indexOf(k);return `<div class="prow"><span style="display:flex;gap:10px;align-items:center"><span class="rank ${r>=0?'on':''}">${r>=0?r+1:''}</span>${PAINNAME[k]}</span><button data-top="${k}" ${r<0&&S.top3.length>=3?'disabled':''}>${r>=0?'เอาออก':'จัดเป็นปัญหาหลัก'}</button></div>`}).join(''):'<p class="muted">ยังไม่ได้เลือกปัญหา เลือกจากฝั่งซ้ายก่อนนะครับ</p>'}</div></div></div>
 <div class="pager"><button class="btn" data-go="org">กลับไปข้อมูลองค์กร</button><button class="btn pri" data-go="lean">เริ่มแบบประเมินด้านลีน</button></div>`}

const STEPS=[['lean','ลีน'],['ps','ความเสถียร'],['dl','ดิจิทัลลีน'],['dr','ข้อมูล'],['ai','AI'],['results','ผลลัพธ์']];
function stepbar(cur){return `<div class="steps">${STEPS.map(([id,l],i)=>{const isCur=id===cur||(id==='ai'&&cur==='air');let done=false,part=false;if(MOD[id]){const ids=id==='ai'?['ai','air']:[id];const ms=ids.reduce((a,x)=>a+missing(x).length,0),n=ids.reduce((a,x)=>a+MOD[x].n,0);done=ms===0;part=ms>0&&ms<n}return `<button data-go="${id}" class="${isCur?'cur':''} ${done?'done':''} ${part?'part':''}"><b>ขั้นที่ ${i+1}</b>${l}</button>`}).join('')}</div>`}

function missBar(mid){const ms=missing(mid).length;if(!ms)return `<div class="missbar ok">ประเมินครบทุกข้อในส่วนนี้แล้ว</div>`;
 return `<div class="missbar"><span>ยังไม่ได้ประเมิน <b>${ms}</b> ข้อ จาก ${MOD[mid].n} ข้อ</span><button class="btn" data-act="nextmiss">ไปข้อที่ยังไม่ได้ประเมิน</button></div>`}
function vMod(mid){const m=MOD[mid];const order=['lean','ps','dl','dr','ai','air'];const i=order.indexOf(mid);const prev=order[i-1],next=order[i+1]||'results';
 let h=header(m.name,`${m.th} มี ${m.dims.length} มิติ ${m.n} ข้อ ให้คะแนนตามสภาพจริงตอนนี้ ไม่ใช่สิ่งที่วางแผนไว้`);
 h+=stepbar(mid);
 h+=`<div class="stick"><div id="missbar">${missBar(mid)}</div><div class="legend" aria-label="ความหมายของคะแนน">${LV.map((l,j)=>`<div><b>${j+1}</b>${l}</div>`).join('')}</div></div>`;
 m.dims.forEach(d=>{const ds=dimScore(d.id),dm=dimMissing(d.id);h+=`<section class="dim"><div class="dimhead"><span class="did">${d.id}</span><h2>${d.name}</h2><span class="misstag" id="dm-${d.id}" ${dm?'':'hidden'}>ยังไม่ได้ประเมิน ${dm} ข้อ</span><span class="dsc c-${tone(ds)}" id="ds-${d.id}">${fmt(ds)}</span></div>`;
  d.qs.forEach((q,k)=>{const qid=d.id+'_'+(k+1),cur=S.answers[qid];const opts=d.opts||LV;
   h+=`<div class="q ${cur?'':'miss'}" id="q-${qid}"><div class="qt"><span class="qn">${k+1}</span><span>${q}<span class="misstag qm">ยังไม่ได้ประเมิน</span></span></div><div class="sc ${d.opts?'wide':''}" role="radiogroup" aria-label="${esc(q)}">${[1,2,3,4,5].map(v=>`<label class="v${v} ${cur===v?'on':''}" title="${v} = ${opts[v-1]}"><input type="radio" name="${qid}" value="${v}" ${cur===v?'checked':''}><span>${v}</span>${d.opts?`<small>${d.opts[v-1]}</small>`:''}</label>`).join('')}</div></div>`});
  if(d.opts)h+=`<p class="small muted" style="margin:0;padding:8px 18px">ข้อนี้ใช้ตัวเลือกเฉพาะ แต่ละตัวเลือกแปลงเป็นคะแนน 1–5 ตามลำดับ</p>`;
  h+='</section>'});
 h+=`<div class="pager">${prev?`<button class="btn" data-go="${prev}">ย้อนกลับ ${MOD[prev].name}</button>`:'<button class="btn" data-go="pains">ย้อนกลับ ปัญหาของฝ่ายผลิต</button>'}<button class="btn pri" data-act="nextmod" data-to="${next}">${MOD[next]?'ต่อไป '+MOD[next].name:'ดูผลการประเมิน'}</button></div>`;
 return h}
function refreshMiss(did){const mb=document.getElementById('missbar');if(mb)mb.innerHTML=missBar(view);const dm=dimMissing(did),el=document.getElementById('dm-'+did);if(el){el.hidden=!dm;el.textContent='ยังไม่ได้ประเมิน '+dm+' ข้อ'}
 const nc=document.querySelector(`[data-navc="${view}"]`);if(nc)nc.outerHTML=navCount(view);
 document.querySelectorAll('.steps button').forEach(b=>{const id=b.dataset.go;if(!MOD[id])return;const ids=id==='ai'?['ai','air']:[id];const ms=ids.reduce((a,x)=>a+missing(x).length,0),n=ids.reduce((a,x)=>a+MOD[x].n,0);b.classList.toggle('done',ms===0);b.classList.toggle('part',ms>0&&ms<n)});
 const nb=document.querySelector('[data-act="nextmod"]');if(nb&&skipArm===view&&!missing(view).length){skipArm=null;const to=nb.dataset.to;nb.textContent=MOD[to]?'ต่อไป '+MOD[to].name:'ดูผลการประเมิน'}}
function jumpMiss(){const all=[...document.querySelectorAll('.q.miss')];if(!all.length)return;const tgt=all.find(q=>q.getBoundingClientRect().top>180)||all[0];
 tgt.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center'});tgt.classList.remove('flash');void tgt.offsetWidth;tgt.classList.add('flash');const inp=tgt.querySelector('input');if(inp)inp.focus({preventScroll:true})}

function vResults(){const c=core(),lv=level(c);
 let h=header('ผลการประเมิน','สรุปคะแนนทั้ง 6 ด้าน ระดับการพัฒนา และด่านตรวจที่ระบบเช็กให้ ไม่ได้ดูแค่ค่าเฉลี่ยอย่างเดียว',`<button class="btn" data-go="reco">ดูข้อเสนอแนะ</button>`);
 h+=stepbar('results');
 if(!anyData())return h+`<div class="empty"><p>ยังไม่มีคำตอบให้คำนวณผล ทำแบบประเมินก่อน หรือลองใส่ข้อมูลตัวอย่างดูได้</p><div class="actions"><button class="btn pri" data-go="lean">เริ่มแบบประเมิน</button><button class="btn" data-act="sample">ใส่ข้อมูลตัวอย่าง</button></div></div>`;
 h+=missSummary(false);
 h+=`<div class="dash-top"><div class="panel tower-wrap">${tower(lv)}<div class="lvl-text"><div class="k">ระดับการพัฒนาฝ่ายผลิต</div><div class="lv">ระดับ ${lv}</div><div class="ln">${LEVELS[lv].n}</div><p>${LEVELS[lv].d}</p></div></div><div class="panel"><h2>เปรียบเทียบคะแนนหลัก 6 ด้าน</h2>${coreBars()}</div></div>`;
 h+=`<section class="sec"><h2>ด่านตรวจความพร้อม</h2><div class="two">${gates().map(gateHTML).join('')}</div></section>`;
 h+=`<section class="sec three"><div class="panel radar"><h2>ลีน 12 มิติ</h2>${radar(MOD.lean.dims)}</div><div class="panel radar"><h2>ดิจิทัลลีน 10 มิติ</h2>${radar(MOD.dl.dims)}</div><div class="panel radar"><h2>การใช้ AI 10 ด้าน</h2>${radar(MOD.ai.dims)}</div></section>`;
 h+=`<section class="sec two">${['ps','dr','air'].map(dimTable).join('')}<div class="panel"><h2>ด้านที่ยังห่างเป้ามากที่สุด</h2>${gapTable(8)}</div></section>`;
 return h}
function dimTable(id){const m=MOD[id],v0=modScore(id);return `<div class="panel"><h2>${m.name} ${v0==null?'':fmt(v0)}</h2><div class="tbl-wrap"><table><thead><tr><th>มิติ</th><th class="n">คะแนน</th></tr></thead><tbody>${m.dims.map(d=>`<tr><td>${d.id} ${d.name}</td><td class="n">${scoreCell(dimScore(d.id),d.id)}</td></tr>`).join('')}</tbody></table></div></div>`}
function gapTable(n){const w=weakestDims(n);if(!w.length)return '<p class="muted">ยังไม่มีข้อมูล</p>';return `<div class="tbl-wrap"><table><thead><tr><th>มิติ</th><th>ส่วน</th><th class="n">คะแนน</th><th class="n">ห่างเป้า</th></tr></thead><tbody>${w.map(x=>`<tr><td>${x.d.id} ${x.d.name}</td><td>${MOD[x.d.mod].name}</td><td class="n"><b class="c-${tone(x.s)}">${fmt(x.s)}</b></td><td class="n">${(5-x.s).toFixed(1)}</td></tr>`).join('')}</tbody></table></div>`}

function phaseTag(p){return `<span class="tag t-${p.toLowerCase()}">${PHASE[p].t}</span>`}
function prTable(list){return `<div class="tbl-wrap"><table><thead><tr><th>#</th><th>โครงการ</th><th>ระยะ</th><th class="n">ห่างเป้า</th><th class="n">ผลกระทบ</th><th class="n">ความพร้อม</th><th class="n">คะแนนความสำคัญ</th></tr></thead><tbody>${list.map((p,i)=>`<tr><td>${i+1}</td><td><b>${p.name}</b><br>${p.flags.map(f=>`<span class="flag ${f[0]}">${f[1]}</span>`).join('')}</td><td>${phaseTag(p.ph)}</td><td class="n">${p.gap.toFixed(1)}</td><td class="n">${p.imp}</td><td class="n">${p.rd.toFixed(1)}</td><td class="n"><b>${p.score}</b></td></tr>`).join('')}</tbody></table></div>`}
function roadmapHTML(){const pr=priorities();return `<div class="road">${['NOW','NEXT','LATER'].map(ph=>{const items=pr.filter(p=>p.ph===ph&&(p.cur==null||p.cur<4)).slice(0,5);
 return `<div class="phase ${ph.toLowerCase()}"><h3>${PHASE[ph].t}</h3><p>${PHASE[ph].d}</p>${items.length?items.map(p=>`<div class="item"><b>${p.name}</b><div class="meta">ความสำคัญ ${p.score} คะแนนตอนนี้ ${p.cur==null?'ยังไม่ได้ประเมิน':fmt(p.cur)}</div>${p.flags.map(f=>`<span class="flag ${f[0]}">${f[1]}</span>`).join('')}</div>`).join(''):'<p class="muted small">ด้านนี้ทำได้ดีแล้ว ไม่มีโครงการเร่งด่วน</p>'}</div>`}).join('')}</div>`}

function vReco(){let h=header('ข้อเสนอแนะ','ระบบจัดลำดับโครงการด้วยสูตร คะแนนความสำคัญ = ห่างเป้า × ผลกระทบต่อธุรกิจ × ความพร้อม แล้วแบ่งเป็น 3 ระยะ',`<button class="btn" data-go="action">ทำแผนปฏิบัติการ</button>`);
 if(!anyData())return h+`<div class="empty"><p>ยังไม่มีคำตอบ เลยยังแนะนำอะไรไม่ได้ ทำแบบประเมินก่อนนะครับ</p><div class="actions"><button class="btn pri" data-go="lean">เริ่มแบบประเมิน</button><button class="btn" data-act="sample">ใส่ข้อมูลตัวอย่าง</button></div></div>`;
 h+=missSummary(true);
 h+=`<section><h2>แผนพัฒนา 3 ระยะ</h2>${roadmapHTML()}</section>`;
 h+=`<section class="sec panel"><h2>แนวทางการใช้ AI ตามปัญหาที่เลือก</h2><p class="muted small" style="margin-top:-6px">สีเขียวคือทำได้ดีแล้ว (3.5 ขึ้นไป) สีเหลืองคือกำลังไปได้ (2.5–3.4) ขอบประคือยังไม่ได้ประเมิน</p>${pathsHTML()}</section>`;
 h+=`<section class="sec panel"><h2>การจัดลำดับความสำคัญ</h2><p class="muted small" style="margin-top:-6px">ห่างเป้า = 5 ลบคะแนนตอนนี้ ผลกระทบจะเพิ่มถ้าตรงกับปัญหาที่เลือก (ปัญหาหลักได้น้ำหนักมากกว่า) ความพร้อมดูจากพื้นฐานที่ต้องมีก่อน และถูกลดลงถ้าติดด่านตรวจ</p>${prTable(priorities())}</section>`;
 return h}

function vAction(){let h=header('แผนปฏิบัติการ','เอาโครงการที่สำคัญที่สุดมาใส่ผู้รับผิดชอบ วันเริ่ม และสถานะ ข้อมูลบันทึกไว้ในเบราว์เซอร์นี้');
 if(!anyData())return h+`<div class="empty"><p>ยังไม่มีผลประเมิน เลยยังไม่มีโครงการให้วางแผน</p><div class="actions"><button class="btn pri" data-go="lean">เริ่มแบบประเมิน</button></div></div>`;
 const pr=priorities().filter(p=>p.cur==null||p.cur<4).slice(0,10);const st='padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface)';
 h+=`<div class="panel tbl-wrap"><table><thead><tr><th>โครงการ</th><th>ระยะ</th><th class="n">ความสำคัญ</th><th>ผู้รับผิดชอบ</th><th>วันเริ่ม</th><th>สถานะ</th><th>ตัวชี้วัดที่ใช้</th></tr></thead><tbody>${pr.map(p=>{const a=S.actions[p.id]||{};return `<tr><td><b>${p.name}</b></td><td>${phaseTag(p.ph)}</td><td class="n">${p.score}</td><td><input style="width:140px;${st}" data-act-k="owner" data-pid="${p.id}" value="${esc(a.owner)}" aria-label="ผู้รับผิดชอบ ${p.name}"></td><td><input type="date" style="${st}" data-act-k="date" data-pid="${p.id}" value="${esc(a.date)}" aria-label="วันเริ่ม ${p.name}"></td><td><select style="${st}" data-act-k="status" data-pid="${p.id}" aria-label="สถานะ ${p.name}">${['ยังไม่เริ่ม','กำลังทำ','เสร็จแล้ว'].map(s=>`<option ${a.status===s?'selected':''}>${s}</option>`).join('')}</select></td><td class="small">${p.kpi.join(', ')}</td></tr>`}).join('')}</tbody></table></div>`;
 return h}

function execSummary(){const c=core(),lv=level(c);const ranked=MODULES.map(m=>({m,v:c[m.id]})).filter(x=>x.v!=null);if(!ranked.length)return 'ยังไม่มีข้อมูลพอสำหรับสรุป';
 const strong=ranked.reduce((a,b)=>b.v>a.v?b:a),weak=ranked.reduce((a,b)=>b.v<a.v?b:a);const pr=priorities();const fails=gates().filter(g=>g.fail===true);const who=S.org.name?esc(S.org.name):'ฝ่ายผลิต';
 let s=`${who} อยู่ที่ระดับ ${lv} ${LEVELS[lv].n} ด้านที่แข็งที่สุดคือ${strong.m.kpi} (${fmt(strong.v)}) ส่วนที่ต้องเร่งที่สุดคือ${weak.m.kpi} (${fmt(weak.v)}) `;
 s+=fails.length?`มีด่านตรวจที่ยังไม่ผ่าน ${fails.length} ข้อ คือ ${fails.map(g=>g.msg).join(' และ')} `:'ผ่านด่านตรวจครบทุกข้อ ';
 s+=`โครงการที่ควรเริ่มก่อนคือ ${pr.slice(0,3).map(p=>p.name).join(', ')}`;
 if(S.top3.length)s+=` ซึ่งตอบโจทย์ปัญหาหลักอย่าง ${S.top3.map(k=>PAINNAME[k]).join(', ')}`;
 const tm=totalMissing();if(tm)s+=` (หมายเหตุ ยังไม่ได้ประเมินอีก ${tm} ข้อ ผลนี้คิดจากข้อที่ตอบแล้วเท่านั้น)`;
 return s}

function missReport(){const t=totalMissing();if(!t)return '<p>ประเมินครบทุกข้อแล้ว</p>';
 return `<p>ยังไม่ได้ประเมินทั้งหมด ${t} ข้อ คะแนนในรายงานนี้คิดจากข้อที่ตอบแล้วเท่านั้น</p>`+MODULES.map(m=>{const ms=missing(m.id);if(!ms.length)return '';const by={};ms.forEach(x=>(by[x.d.id]=by[x.d.id]||[]).push(x));
  return `<h3 class="sec">${m.name} (${ms.length} ข้อ)</h3><div class="tbl-wrap"><table><tbody>${Object.keys(by).map(id=>`<tr><td style="width:240px">${id} ${DIM[id].name}</td><td>${by[id].map(x=>x.k+'. '+x.q).join('<br>')}</td></tr>`).join('')}</tbody></table></div>`}).join('')}

function reportInner(){const c=core(),lv=level(c),o=S.org;const pr=priorities();const top=pr.filter(p=>p.cur==null||p.cur<4).slice(0,8);
 const row=(k,v)=>`<tr><th style="width:220px">${k}</th><td>${v?esc(v):'–'}</td></tr>`;const kpis=[...new Set(top.flatMap(p=>p.kpi))];
 return `<div class="rh"><div><h1>LEAN360 Production Transformation Diagnostic</h1><div class="muted">รายงานผลระบบวินิจฉัยความพร้อมเพื่อยกระดับการผลิตจาก Lean สู่ Digital Lean และ AI</div><div class="muted">${o.name?esc(o.name):'ไม่ระบุชื่อบริษัท'}</div></div><div class="muted small">วันที่ออกรายงาน ${new Date().toLocaleDateString('th-TH',{year:'numeric',month:'long',day:'numeric'})}</div></div>
 ${totalMissing()?`<div class="missbox" style="margin-top:16px"><div><h3>ยังไม่ได้ประเมิน ${totalMissing()} ข้อ</h3><p>คะแนนในรายงานคิดจากข้อที่ตอบแล้วเท่านั้น ดูรายการข้อที่ขาดได้ที่หัวข้อ 15</p></div></div>`:''}
 <h2>1. ข้อมูลองค์กร</h2><div class="tbl-wrap"><table><tbody>${row('ชื่อบริษัท',o.name)}${row('ประเภทอุตสาหกรรม',o.industry)}${row('ขนาดองค์กร',o.size)}${row('พนักงานทั้งหมด / ฝ่ายผลิต',(o.employees||'–')+' / '+(o.prodEmployees||'–'))}${row('สายการผลิต / เครื่องจักร',(o.lines||'–')+' / '+(o.machines||'–'))}${row('รูปแบบการผลิต',o.system)}${row('ประเภทการผลิต',o.ptype)}${row('ระดับการใช้ระบบอัตโนมัติ',o.automation)}${row('ระบบที่ใช้อยู่',S.systems.join(', '))}${row('ปัญหาที่เจอ',S.pains.map(k=>PAINNAME[k]).join(', '))}${row('3 ปัญหาหลัก',S.top3.map((k,i)=>(i+1)+'. '+PAINNAME[k]).join('  '))}</tbody></table></div>
 <h2>2. บทสรุปผู้บริหาร</h2><p>${execSummary()}</p><p><b>ระดับการพัฒนา:</b> ระดับ ${lv} ${LEVELS[lv].n} ${LEVELS[lv].d}</p>
 <h2>3–8. คะแนน 6 ด้าน</h2>${coreBars()}<div class="two sec">${MODULES.map(m=>`<div><h3>${m.name} ${fmt(c[m.id])}</h3><table><tbody>${m.dims.map(d=>`<tr><td>${d.id} ${d.name}</td><td class="n">${scoreCell(dimScore(d.id),d.id)}</td></tr>`).join('')}</tbody></table></div>`).join('')}</div>
 <h3 class="sec">ด่านตรวจความพร้อม</h3><table><tbody>${gates().map(g=>`<tr><td>${g.k}</td><td>${g.fail===null?'ยังไม่ได้ประเมินข้อที่เกี่ยวข้อง':g.fail?'<b>ไม่ผ่าน</b> '+g.msg:'ผ่าน'}</td><td class="small muted">${g.cond}</td></tr>`).join('')}</tbody></table>
 <h2>9. กราฟเรดาร์</h2><div class="three"><div class="radar"><h3>ลีน</h3>${radar(MOD.lean.dims)}</div><div class="radar"><h3>ดิจิทัลลีน</h3>${radar(MOD.dl.dims)}</div><div class="radar"><h3>การใช้ AI</h3>${radar(MOD.ai.dims)}</div></div>
 <h2>10. ด้านที่ยังห่างเป้ามากที่สุด</h2>${gapTable(8)}
 <h2>11. โครงการที่ควรทำ</h2>${prTable(top)}
 <h2>12. แนวทางการใช้ AI</h2>${pathsHTML()}
 <h2>13. แผนพัฒนา 3 ระยะ</h2>${roadmapHTML()}
 <h2>14. ตัวชี้วัดที่คาดว่าจะดีขึ้น</h2><p>ควรเก็บค่าตั้งต้นไว้ก่อนเริ่มโครงการ แล้ววัดผลทุกเดือน: ${kpis.join(', ')||'–'}</p><div class="tbl-wrap"><table><thead><tr><th>โครงการ</th><th>ตัวชี้วัดที่ได้รับผล</th></tr></thead><tbody>${top.map(p=>`<tr><td>${p.name}</td><td>${p.kpi.join(', ')}</td></tr>`).join('')}</tbody></table></div>
 <h2>15. ข้อที่ยังไม่ได้ประเมิน</h2>${missReport()}${CREDIT}`}

function vReport(){let h=header('รายงาน','รายงานฉบับเต็มพร้อมพิมพ์ กดพิมพ์ PDF แล้วเลือกบันทึกเป็น PDF ได้เลย',`<button class="btn" data-act="export">ส่งออกรายงาน (.html)</button><button class="btn pri" data-act="print">พิมพ์ PDF</button>`);
 if(!anyData())return h+`<div class="empty"><p>ยังไม่มีผลประเมินให้ออกรายงาน</p><div class="actions"><button class="btn pri" data-go="lean">เริ่มแบบประเมิน</button></div></div>`;
 return h+`<article class="report" id="report">${reportInner()}</article>`}

function vKB(){const t=(a,b)=>`<tr><td><b>${a}</b></td><td>${b}</td></tr>`;
 return header('คลังความรู้','หลักคิดและคำศัพท์ที่ใช้ในระบบนี้','<button class="btn" data-act="backup">สำรองข้อมูล (.json)</button><button class="btn" data-act="import">นำเข้าข้อมูล</button><button class="btn warn" data-act="reset">ล้างข้อมูลทั้งหมด</button>')+
 `<div class="two"><div class="panel"><h2>ระดับคะแนน 1–5</h2><table><tbody>${LV.map((l,i)=>t(i+1,l)).join('')}</tbody></table><p class="small muted">คะแนนแต่ละมิติคือค่าเฉลี่ยของข้อในมิตินั้น คะแนนแต่ละส่วนคือค่าเฉลี่ยของมิติ ข้อที่ยังไม่ได้ประเมินจะไม่ถูกนำมาคิด และระบบจะขึ้นเตือนไว้ทุกหน้า</p></div>
 <div class="panel"><h2>ระดับการพัฒนาฝ่ายผลิต</h2><table><tbody>${t('ระดับ 1','การผลิตแบบดั้งเดิม ลีนต่ำกว่า 2.5')}${t('ระดับ 2','การผลิตแบบลีน ลีน 2.5 ขึ้นไป')}${t('ระดับ 3','การผลิตแบบดิจิทัลลีน ลีนและดิจิทัลลีน 3 ขึ้นไป')}${t('ระดับ 4','การผลิตอัจฉริยะ ลีนและดิจิทัลลีน 3.5 ขึ้นไป ข้อมูล 3.5 ขึ้นไป')}${t('ระดับ 5','การผลิตขับเคลื่อนด้วย AI ลีนและดิจิทัลลีน 3.5 ขึ้นไป ข้อมูล 4 ขึ้นไป ความพร้อมด้าน AI 3.5 ขึ้นไป')}</tbody></table></div>
 <div class="panel"><h2>ด่านตรวจความพร้อม</h2><p class="small muted" style="margin-top:-6px">ไม่ได้ดูค่าเฉลี่ยอย่างเดียว ถ้าพื้นฐานไม่ผ่าน ระบบจะเตือนและลดความพร้อมของโครงการที่ข้ามขั้น</p><table><tbody>${t('ด่านลีน','งานมาตรฐานต่ำกว่า 3 หรือความเสถียรต่ำกว่า 3 แปลว่ายังไม่ควรเร่งระบบอัตโนมัติ')}${t('ด่านดิจิทัล','ลีนต่ำกว่า 3 แปลว่าควรปรับพื้นฐานลีนก่อนทำดิจิทัลลีน')}${t('ด่าน AI','ความพร้อมด้านข้อมูลต่ำกว่า 3 แปลว่ายังไม่พร้อมสำหรับ AI')}${t('ด่าน AI ขั้นสูง','ข้อมูลต่ำกว่า 4 หรือความเสถียรต่ำกว่า 3.5 หรือการเชื่อมระบบต่ำกว่า 3.5 แปลว่า AI ควรอยู่แค่ระดับนำร่อง')}</tbody></table></div>
 <div class="panel"><h2>การจัดลำดับความสำคัญ</h2><p>คะแนนความสำคัญ = ห่างเป้า × ผลกระทบ × ความพร้อม</p><table><tbody>${t('ห่างเป้า','5 ลบคะแนนตอนนี้ของมิติที่เกี่ยวข้อง')}${t('ผลกระทบ','เริ่มที่ 2 ตรงกับปัญหาที่เลือก +1 ตรงกับปัญหาหลัก +2 สูงสุด 5')}${t('ความพร้อม','ค่าเฉลี่ยของพื้นฐานที่ต้องมีก่อน ถูกลดลงถ้าติดด่านตรวจ')}</tbody></table></div>
 <div class="panel" style="grid-column:1/-1"><h2>คำศัพท์</h2><div class="tbl-wrap"><table><tbody>${t('OEE','ประสิทธิผลโดยรวมของเครื่องจักร คิดจากเวลาเดินเครื่อง × ความเร็ว × คุณภาพ')}${t('VSM','แผนผังสายธารคุณค่า แสดงการไหลของวัสดุและข้อมูลตั้งแต่ต้นจนจบ')}${t('SMED','เทคนิคลดเวลาเปลี่ยนรุ่นให้สั้นที่สุด')}${t('Poka-Yoke','กลไกป้องกันความผิดพลาดตั้งแต่ต้นทาง')}${t('TPM','การบำรุงรักษาทวีผลที่ทุกคนมีส่วนร่วม')}${t('FPY','อัตราผ่านรอบแรก สัดส่วนงานที่ดีตั้งแต่ครั้งแรก')}${t('MTBF / MTTR','เวลาเฉลี่ยระหว่างเครื่องเสีย / เวลาเฉลี่ยในการซ่อม')}${t('MES','ระบบควบคุมและติดตามการผลิต')}${t('CMMS','ระบบจัดการงานซ่อมบำรุง')}${t('SPC','การควบคุมกระบวนการด้วยสถิติ')}${t('คัมบัง','บัตรหรือสัญญาณบอกให้เติมของ ใช้คุมการผลิตแบบดึง')}${t('ดิจิทัลทวิน','แบบจำลองดิจิทัลของสายการผลิต ใช้ทดลองก่อนทำจริง')}</tbody></table></div></div></div>`}

/* ============ เหตุการณ์ ============ */
let skipArm=null;
document.addEventListener('click',e=>{
 const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
 const t=e.target.closest('[data-top]');if(t){const k=t.dataset.top;const i=S.top3.indexOf(k);if(i>=0)S.top3.splice(i,1);else if(S.top3.length<3)S.top3.push(k);save();render();return}
 const a=e.target.closest('[data-act]');if(a)act(a.dataset.act,a)});
document.addEventListener('change',e=>{const el=e.target;
 if(el.type==='radio'&&MOD[view]&&el.name.includes('_')){S.answers[el.name]=+el.value;save();
  el.closest('.sc').querySelectorAll('label').forEach(l=>l.classList.toggle('on',l.querySelector('input').checked));
  const qe=document.getElementById('q-'+el.name);if(qe)qe.classList.remove('miss','flash');
  const did=el.name.split('_')[0];const ds=dimScore(did);const de=document.getElementById('ds-'+did);if(de){de.textContent=fmt(ds);de.className='dsc c-'+tone(ds)}
  refreshMiss(did);return}
 if(el.dataset.org!==undefined){S.org[el.dataset.org]=el.value;save();if(el.type==='radio')el.closest('.radios').querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.querySelector('input').checked));return}
 if(el.dataset.sys){const x=el.dataset.sys;S.systems=el.checked?[...new Set([...S.systems,x])]:S.systems.filter(s=>s!==x);el.closest('.chip').classList.toggle('on',el.checked);save();return}
 if(el.dataset.pain){const k=el.dataset.pain;if(el.checked)S.pains.push(k);else{S.pains=S.pains.filter(p=>p!==k);S.top3=S.top3.filter(p=>p!==k)}save();render();return}
 if(el.dataset.actK){const id=el.dataset.pid;S.actions[id]=S.actions[id]||{};S.actions[id][el.dataset.actK]=el.value;save()}});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.org!==undefined&&el.tagName==='INPUT'&&el.type!=='radio'){S.org[el.dataset.org]=el.value;save()}if(el.dataset.actK==='owner'){const id=el.dataset.pid;S.actions[id]=S.actions[id]||{};S.actions[id].owner=el.value;save()}});
document.getElementById('menuBtn').onclick=()=>{document.getElementById('side').classList.add('open');document.getElementById('scrim').classList.add('open')};
document.getElementById('scrim').onclick=closeMenu;
function closeMenu(){document.getElementById('side').classList.remove('open');document.getElementById('scrim').classList.remove('open')}
let toastT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),3200)}
let dlP=null;function getDl(){if(!dlP)dlP=(window.claude&&window.claude.use)?window.claude.use('downloads').catch(()=>null):Promise.resolve(null);return dlP}
async function saveFile(filename,data){const dl=await getDl();if(!dl){toast('หน้านี้ส่งไฟล์ออกไม่ได้ ลองใช้พิมพ์ PDF แทนนะครับ');return}
 try{await dl.save({filename,data});toast('บันทึกไฟล์แล้ว')}catch(err){if(err&&err.code==='declined')return;toast('บันทึกไฟล์ไม่สำเร็จ ลองใช้พิมพ์ PDF แทน')}}
let resetArm=false;
function act(k,el){
 if(k==='nextmiss'){jumpMiss();return}
 if(k==='nextmod'){const to=el.dataset.to,ms=missing(view).length;if(ms&&skipArm!==view){skipArm=view;jumpMiss();el.textContent='ข้ามไปก่อน แล้วค่อยกลับมาตอบ';toast(`ส่วนนี้ยังไม่ได้ประเมิน ${ms} ข้อ ถ้าจะข้ามไปก่อนให้กดปุ่มอีกครั้ง`);return}go(to);return}
 if(k==='print'){if(view!=='report')go('report');setTimeout(()=>{try{window.print()}catch(e){toast('เบราว์เซอร์นี้สั่งพิมพ์จากหน้านี้ไม่ได้')}},150);return}
 if(k==='export'){if(!anyData()){toast('ยังไม่มีผลประเมินให้ส่งออก');return}const css=document.querySelector('style').textContent;
  const html=`<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>รายงาน LEAN360 Production Transformation Diagnostic</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet"><style>${css}body{background:#fff;padding:24px}</style></head><body data-theme="light"><article class="report" style="margin:0 auto">${reportInner()}</article></body></html>`;
  const nm=(S.org.name||'report').replace(/[\\/:*?"<>|]/g,'').trim()||'report';saveFile(`LEAN360-${nm}.html`,html);return}
 if(k==='backup'){saveFile('lean360-backup.json',JSON.stringify(S,null,2));return}
 if(k==='import'){document.getElementById('importFile').click();return}
 if(k==='sample'){fillSample();return}
 if(k==='reset'){if(!resetArm){resetArm=true;el.textContent='กดอีกครั้งเพื่อยืนยัน';setTimeout(()=>{resetArm=false;if(el.isConnected)el.textContent='ล้างข้อมูลทั้งหมด'},4000);return}resetArm=false;S=blank();save();toast('ล้างข้อมูลแล้ว');go('dashboard')}}
document.getElementById('importFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||typeof o.answers!=='object')throw 0;S=Object.assign(blank(),o);save();toast('นำเข้าข้อมูลแล้ว');go('dashboard')}catch(err){toast('ไฟล์นี้ไม่ใช่ข้อมูลสำรองของ LEAN360')}};r.readAsText(f);e.target.value=''});
function fillSample(){const mean={lean:3.3,ps:3.0,dl:2.5,dr:2.4,ai:1.4,air:2.1};let seed=7;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
 MODULES.forEach(m=>m.dims.forEach(d=>{const dm=mean[m.id]+(rnd()-0.5)*1.4;d.qs.forEach((_,i)=>{const qid=d.id+'_'+(i+1);if(m.id==='air'&&d.id==='AIR8'&&i>0)return;S.answers[qid]=Math.max(1,Math.min(5,Math.round(dm+(rnd()-0.5)*1.6)))})}));
 S.org=Object.assign({name:'บริษัทตัวอย่าง จำกัด',industry:'ยานยนต์และชิ้นส่วน',size:'ขนาดกลาง',employees:'420',prodEmployees:'310',lines:'6',machines:'85',automation:'กึ่งอัตโนมัติ',system:'ผลิตตามคำสั่งซื้อ',ptype:'ผลิตเป็นชิ้น'},S.org.name?S.org:{});
 if(!S.systems.length)S.systems=['ERP','PLC','บาร์โค้ด','แดชบอร์ด'];
 if(!S.pains.length){S.pains=['defect','downtime','oee','planning','realtime','wip'];S.top3=['downtime','defect','planning']}
 save();toast('ใส่ข้อมูลตัวอย่างแล้ว (เว้นไว้ 2 ข้อให้เห็นการแจ้งเตือน)');go('dashboard')}
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(v&&v!==view){view=v;if(!VIEWS())view='dashboard';render()}});
render();getDl();

</script>
